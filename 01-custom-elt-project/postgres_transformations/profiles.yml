elt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DEST_DB_HOST') }}"
      port: 5432
      user: "{{ env_var('DEST_DB_USER') }}"
      password: "{{ env_var('DEST_DB_PASSWORD') }}"
      dbname: "{{ env_var('DEST_DB_NAME') }}"
      schema: analytics
      threads: 1